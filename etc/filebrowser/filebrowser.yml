server:
  port: 8080
  listen: 127.0.0.1
  baseURL: "/data"
  database: /etc/filebrowser/database.db
  cacheDir: /tmp/filebrowser
  disableUpdateCheck: true
  sources:
    - path: /data
      name: data
      config:
        defaultEnabled: true
auth:
  adminUsername: pi
  methods:
    noauth: true
http:
  trustedHeaders:
    - X-Forwarded-Proto
    - X-Forwarded-Host
    - X-Forwarded-For
    - X-Real-IP
userDefaults:
  account:
    permissions:
      modify: true
      create: true
      delete: true
      download: true
