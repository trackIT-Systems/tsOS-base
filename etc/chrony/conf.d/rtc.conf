# The RTC, once tsscheduled has checked it (docs/time.md): tsscheduled sends a sample every
# second, taken at the start of an RTC second. poll 2 filter 3: every 4 s the median of 3 samples,
# so a single bad sample is dropped, and chrony selects the RTC after three polls, about 12 s.
# delay 2 adds 1 s to its distance, so NTP and GNSS always win the selection.
refclock SOCK /run/chrony/rtc.sock refid RTC poll 2 filter 3 precision 1e-2 delay 2 stratum 10
