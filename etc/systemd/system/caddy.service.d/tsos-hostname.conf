# The Caddyfile names its HTTPS certificates after the device ({$TSOS_HOSTNAME}),
# which hostname-config.service sets at boot. Caddy only reads the hostname from
# the environment, so write it to a file first (as root, `+`); systemd reads
# EnvironmentFile= after ExecStartPre has run.
[Unit]
After=hostname-config.service

[Service]
ExecStartPre=+/bin/sh -c 'echo "TSOS_HOSTNAME=$(cat /proc/sys/kernel/hostname)" > /run/caddy-tsos.env'
EnvironmentFile=-/run/caddy-tsos.env
