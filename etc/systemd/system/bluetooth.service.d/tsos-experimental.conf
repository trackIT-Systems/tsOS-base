# BlueZ offers AdvertisementMonitor1, which passive LE scanning needs, only with its experimental
# D-Bus interfaces. smartsolard and solarlifed scan passively with it: a passive scan needs no
# random address, which the controller refuses while tsconfig-ble advertises (kernel error
# "Opcode 0x2005 failed: -16" at every scan restart), and no scan response, which does not arrive
# while the Wi-Fi access point is up (tsOS-base#50). It adds no other interface on BlueZ 5.82.
[Service]
ExecStart=
ExecStart=/usr/libexec/bluetooth/bluetoothd --experimental
