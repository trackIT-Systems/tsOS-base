# pid_file /var/run/mosquitto.pid
persistence true
persistence_location /var/lib/mosquitto/

# Queued messages survive a power cut only once they are saved; the default is
# every 30 minutes. Each save rewrites the whole database (see docs/mqtt.md).
autosave_interval 300

# Per client, so also the bridge's outgoing queue while the uplink is down.
# 100000 QoS 1 messages are about 26 MB of database; the byte limit (payload
# only) guards against large messages. QoS 0 messages are not queued.
max_queued_messages 100000
max_queued_bytes 33554432

# QoS 1 messages sent before the first is acknowledged (default 20), so the
# bridge drains its queue over LTE's long round trips.
max_inflight_messages 100

# Mosquitto 2 drops its implicit loopback listener as soon as one listener is
# declared, so declare it. Settings are per listener: anonymous access is
# allowed on the loopback listeners only, and a listener an operator adds in
# mosquitto.d keeps Mosquitto's secure default (no anonymous clients).
per_listener_settings true

# Local publishers and subscribers (radiotracking, tstelemetry, smartsolar, ...).
listener 1883 127.0.0.1
allow_anonymous true
listener 1883 ::1
allow_anonymous true

# MQTT over WebSockets for tsconfig's live dashboard. Loopback only: Caddy
# serves it at /mqtt after checking the login (see docs/security.md).
listener 9001 127.0.0.1
protocol websockets
allow_anonymous true

include_dir /boot/firmware/mosquitto.d
