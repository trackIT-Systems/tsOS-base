# pid_file /var/run/mosquitto.pid
persistence true
persistence_location /var/lib/mosquitto/

# Mosquitto 2 drops its implicit loopback listener as soon as one listener is
# declared, so declare it. Settings are per listener: anonymous access is
# allowed on the loopback listeners only, and a listener an operator adds in
# mosquitto.d keeps Mosquitto's secure default (no anonymous clients).
per_listener_settings true

# Local publishers and subscribers (radiotracking, mqttutil, smartsolar, ...).
listener 1883 127.0.0.1
allow_anonymous true
listener 1883 ::1
allow_anonymous true

# MQTT over WebSockets for tsconfig's live dashboard. Loopback only: Caddy
# serves it at /mqtt after checking the login (see docs/security.md).
listener 9001 127.0.0.1
protocol websockets
allow_anonymous true

include_dir /boot/firmware/mosquitto.d
