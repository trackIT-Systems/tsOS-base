# See docs/security.md, "SSH keys". Every account uses only its own
# ~/.ssh/authorized_keys (root's is baked into the image); Debian's default
# .ssh/authorized_keys2 is not read, so a stale copy grants nothing.
AuthorizedKeysFile .ssh/authorized_keys

# pi also accepts the keys on the boot partition (config bundles, SD card),
# read in place: no copy to keep in sync, and a removed key stops working at
# the next login. StrictModes accepts the file because the fstab masks make it
# root-owned 0644 in root-owned 0755 directories.
Match User pi
    AuthorizedKeysFile .ssh/authorized_keys /boot/firmware/authorized_keys
