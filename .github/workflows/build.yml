name: Build tsOS-base Images

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

env:
  # The tag of the security-hardening release (docs/security.md): root/pi
  # privilege separation, root-owned boot partition and source trees, etc.
  # A device on any release older than this is on an incompatible security
  # model, so no delta update is published into it - it needs a fresh
  # reflash instead (see "Migration" in docs/security.md). Update this to
  # this release's actual tag once it's cut. Until then it's a placeholder
  # that sorts after any real calver tag (YYYY.M.PATCH), so every release
  # currently looks older than the baseline and delta generation is always
  # skipped - safe-by-default rather than silently publishing a delta
  # across the security boundary if this got forgotten.
  DELTA_BASELINE: "9999.12.999"

jobs:
  release:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Extract release notes
        id: notes
        run: |
          TAG="${GITHUB_REF_NAME}"
          NOTES_FILE="${RUNNER_TEMP}/release_notes.md"
          if awk -v tag="$TAG" '
            $0 ~ "^## \\[" tag "\\]" { found=1; print; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > "$NOTES_FILE" && [ -s "$NOTES_FILE" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "Release $TAG" > "$NOTES_FILE"
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
          echo "path=$NOTES_FILE" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          prerelease: True
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: ${{ steps.notes.outputs.found == 'false' }}
          
  build-arm64:
    runs-on: ubuntu-24.04-arm
    needs: release
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ secrets.TSDEPLOY_REPO_READ }}

      - name: Run tsOS-base.Pifile
        uses: Nature40/pimod@v0.9.3
        with:
          pifile: tsOS-base.Pifile

      - name: Package tsOS-base-arm64-${{github.ref_name}}.zip
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mv tsOS-base-arm64.img tsOS-base-arm64-${{github.ref_name}}.img
          zip tsOS-base-arm64-${{github.ref_name}}.zip tsOS-base-arm64-${{github.ref_name}}.img

      - name: Upload Release tsOS-base-arm64-${{github.ref_name}}.zip
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{github.ref_name}} tsOS-base-arm64-${{github.ref_name}}.zip

      - name: Get latest stable release
        id: get_latest_release
        run: |
          LATEST_RELEASE=$(gh release list --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName' || echo "")
          echo "latest_release=$LATEST_RELEASE" >> $GITHUB_OUTPUT
          echo "Latest stable release: $LATEST_RELEASE"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check delta baseline
        id: check_baseline
        if: steps.get_latest_release.outputs.latest_release != ''
        run: |
          PREVIOUS_TAG="${{ steps.get_latest_release.outputs.latest_release }}"
          BASELINE="${{ env.DELTA_BASELINE }}"
          # Strip a leading "v" defensively in case a tag is ever prefixed
          # that way; this repo's calver tags aren't, but the comparison
          # shouldn't silently misbehave if that ever changes.
          NEWEST=$(printf '%s\n%s\n' "${PREVIOUS_TAG#v}" "${BASELINE#v}" | sort -V | tail -n1)
          if [ "$NEWEST" = "${PREVIOUS_TAG#v}" ]; then
            # PREVIOUS_TAG is at least as new as BASELINE (this also covers
            # PREVIOUS_TAG == BASELINE, which sorts as a tie either way):
            # proceed with the delta.
            echo "skip_delta=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip_delta=true" >> "$GITHUB_OUTPUT"
            echo "Previous release $PREVIOUS_TAG is older than the security baseline $BASELINE - skipping delta update generation (see docs/security.md, Migration)."
          fi

      - name: Download previous release image
        if: steps.get_latest_release.outputs.latest_release != '' && steps.check_baseline.outputs.skip_delta != 'true'
        run: |
          PREVIOUS_TAG="${{ steps.get_latest_release.outputs.latest_release }}"
          echo "Downloading tsOS-base-arm64-${PREVIOUS_TAG}.zip"
          gh release download ${PREVIOUS_TAG} -p "tsOS-base-arm64-${PREVIOUS_TAG}.zip"
          unzip "tsOS-base-arm64-${PREVIOUS_TAG}.zip"
          echo "Downloaded and extracted: tsOS-base-arm64-${PREVIOUS_TAG}.img"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate update file with pidiff
        if: steps.get_latest_release.outputs.latest_release != '' && steps.check_baseline.outputs.skip_delta != 'true'
        uses: Nature40/pimod/pidiff@v0.9.3
        with:
          base_image: tsOS-base-arm64-${{ steps.get_latest_release.outputs.latest_release }}.img
          updated_image: tsOS-base-arm64-${{ github.ref_name }}.img
          partition: 2
          output: tsOS-base-arm64-update-${{ steps.get_latest_release.outputs.latest_release }}-to-${{ github.ref_name }}
          tar: true
          rsync_options: --exclude-from=.pidiffignore

      - name: Upload update file to release
        if: steps.get_latest_release.outputs.latest_release != '' && steps.check_baseline.outputs.skip_delta != 'true' && startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREVIOUS_TAG="${{ steps.get_latest_release.outputs.latest_release }}"
          CURRENT_TAG="${{ github.ref_name }}"
          gh release upload ${CURRENT_TAG} "tsOS-base-arm64-update-${PREVIOUS_TAG}-to-${CURRENT_TAG}.tar"
