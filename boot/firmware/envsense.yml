hardware:
  interval_s: 60
  # SoC, RP1 and PMIC temperatures are recorded by tstelemetry. Without sensors
  # envsensed exits cleanly; add external ones here and restart envsense.service:
  #   - id: inside
  #     type: sht3x
  #     address: 0x44    # ADDR to GND
  sensors: []

daemon:
  csv:
    enabled: true
    path: /data
  mqtt:
    enabled: true
    host: localhost
    port: 1883
    qos: 0
